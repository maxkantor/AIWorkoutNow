<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default title (routes override via react-helmet-async) -->
    <title>AIWorkoutNow.com — AI Workout Generator (No Signup)</title>
    <meta name="description" content="Generate a personalized AI workout plan in seconds. No signup. Pay once. Instant access." />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://aiworkoutnow.com/" />

    <!-- Open Graph / Facebook (must be in static HTML for crawlers) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aiworkoutnow.com/" />
    <meta property="og:title" content="AIWorkoutNow.com — AI Workout Generator (No Signup)" />
    <meta property="og:description" content="Generate a personalized AI workout plan in seconds. No signup. Pay once. Instant access." />
    <meta property="og:image" content="https://aiworkoutnow.com/images/og-image.png" />
    <meta property="og:image:url" content="https://aiworkoutnow.com/images/og-image.png" />
    <meta property="og:image:secure_url" content="https://aiworkoutnow.com/images/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1360" />
    <meta property="og:image:height" content="768" />
    <meta property="og:image:alt" content="AIWorkoutNow.com — AI Workout Generator (No Signup)" />
    <meta property="og:site_name" content="AIWorkoutNow" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AIWorkoutNow.com — AI Workout Generator (No Signup)" />
    <meta name="twitter:description" content="Generate a personalized AI workout plan in seconds. No signup. Pay once. Instant access." />
    <meta name="twitter:image" content="https://aiworkoutnow.com/images/og-image.png" />

    <!-- Google AdSense (site verification) -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6352110171108524" crossorigin="anonymous"></script>

    <!-- App / UX -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AIWorkoutNow" />
    
    <!-- Favicon -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />

    <!-- Performance: preload above-the-fold hero background -->
    <link rel="preload" as="image" href="/images/hero-bg.png" fetchpriority="high" />
    <!-- Preload promo video so hipmachine.mp4 loads reliably -->
    <link rel="preload" as="video" href="/images/hipmachine.mp4" type="video/mp4" fetchpriority="low" />

    <!-- Structured data (static for crawlers that don't wait for JS) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://aiworkoutnow.com/#website",
          "url": "https://aiworkoutnow.com/",
          "name": "AIWorkoutNow",
          "description": "Generate a personalized AI workout plan in seconds. No signup. Pay once. Instant access.",
          "publisher": { "@id": "https://aiworkoutnow.com/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://aiworkoutnow.com/ai-workout-generator",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://aiworkoutnow.com/#organization",
          "name": "AIWorkoutNow",
          "url": "https://aiworkoutnow.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://aiworkoutnow.com/images/og-image.png"
          }
        },
        {
          "@type": "SoftwareApplication",
          "name": "AIWorkoutNow AI Workout Generator",
          "applicationCategory": "HealthApplication",
          "operatingSystem": "Web",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD",
            "description": "3 free workouts, no signup required"
          },
          "url": "https://aiworkoutnow.com/"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
